name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        ocaml-compiler:
          - 5

        include:
          # Lower bound declared in dune-project.
          - os: ubuntu-latest
            ocaml-compiler: 4.08

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install opam packages
        run: opam install . --deps-only --with-test

      - name: Run build
        run: opam exec -- dune build

      - name: Run the unit tests
        run: opam exec -- dune runtest
        timeout-minutes: 5

  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml 4.14
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14

      # Must match the version pinned in .ocamlformat.
      - name: Install ocamlformat
        run: opam install ocamlformat.0.20.1

      - name: Check formatting
        run: opam exec -- dune build @fmt
